name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # تنزيل خط Tajawal Bold ليُضمَّن داخل التطبيق
      - name: Download Tajawal font
        run: |
          mkdir -p assets/fonts
          curl -fL --retry 3 -o assets/fonts/Tajawal-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Bold.ttf \
            || { curl -fL -o /tmp/tajawal.zip "https://fonts.google.com/download?family=Tajawal" \
                 && unzip -o /tmp/tajawal.zip "Tajawal-Bold.ttf" -d assets/fonts; }
          test -s assets/fonts/Tajawal-Bold.ttf

          curl -fL --retry 3 -o assets/fonts/Tajawal-Medium.ttf \
            https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Medium.ttf \
            || { curl -fL -o /tmp/tajawal.zip "https://fonts.google.com/download?family=Tajawal" \
                 && unzip -o /tmp/tajawal.zip "Tajawal-Medium.ttf" -d assets/fonts; }
          test -s assets/fonts/Tajawal-Medium.ttf

      # المستودع يحتوي فقط pubspec.yaml و lib/main.dart و lib/background.dart،
      # وهذه الخطوة تولّد مجلد android تلقائياً دون المساس بملفاتك
      - name: Generate android folder
        run: |
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp lib/main.dart /tmp/keep/main.dart
          cp lib/background.dart /tmp/keep/background.dart
          flutter create --platforms=android --project-name wallet_app --org com.example .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/main.dart lib/main.dart
          cp /tmp/keep/background.dart lib/background.dart

      # حقن صلاحية الكاميرا (مطلوبة لقارئ الباركود) داخل AndroidManifest.xml
      - name: Add camera permission
        run: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA"/>#' \
            android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # توليد أيقونة التطبيق من assets/icon/icon.png إذا كان الملف موجوداً
      - name: Generate app icon
        run: |
          if [ -f assets/icon/icon.png ]; then
            flutter pub run flutter_launcher_icons
          else
            echo "⚠️ assets/icon/icon.png غير موجود — تخطّي توليد الأيقونة (سيُستخدم شعار Flutter الافتراضي)"
          fi

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # نشر الـ APK كملف تحميل مباشر في قسم Releases
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
